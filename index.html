<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      background: var(--tg-theme-bg-color, #1c1c1e);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 6px;
      color: var(--tg-theme-text-color, #fff);
    }

    #playerName {
      font-size: 13px;
      opacity: 0.6;
      flex: 1;
    }

    #scoreDisplay {
      font-size: 22px;
      font-weight: 700;
      flex: 1;
      text-align: center;
    }

    #highScoreDisplay {
      font-size: 13px;
      opacity: 0.6;
      flex: 1;
      text-align: right;
    }

    #canvasWrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 0 8px 8px;
    }

    canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="header">
    <div id="playerName"></div>
    <div id="scoreDisplay">0</div>
    <div id="highScoreDisplay">Best: 0</div>
  </div>
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
    }

    // Theme
    const t = tg?.themeParams || {};
    const theme = {
      bg:        t.bg_color           || '#1c1c1e',
      text:      t.text_color         || '#ffffff',
      hint:      t.hint_color         || '#8e8e93',
      button:    t.button_color       || '#30d158',
      link:      t.link_color         || '#30d158',
      secondary: t.secondary_bg_color || '#2c2c2e',
    };

    // Player
    const user = tg?.initDataUnsafe?.user;
    const playerName = user?.first_name || 'Player';
    document.getElementById('playerName').textContent = playerName;

    // Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    let CELL, SIZE;

    function resize() {
      const wrap = document.getElementById('canvasWrap');
      const w = wrap.clientWidth - 16;
      const h = wrap.clientHeight - 8;
      SIZE = Math.floor(Math.min(w, h) / GRID) * GRID;
      canvas.width = SIZE;
      canvas.height = SIZE;
      CELL = SIZE / GRID;
    }

    // State
    let snake, food, dir, nextDir, score, highScore = 0;
    let state = 'start';
    let loop;

    function speed() {
      return Math.max(75, 160 - Math.floor(score / 40) * 10);
    }

    function startGame() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      document.getElementById('scoreDisplay').textContent = 0;
      placeFood();
      state = 'playing';
      if (tg) tg.MainButton.hide();
      clearInterval(loop);
      loop = setInterval(tick, speed());
    }

    function placeFood() {
      let p;
      do {
        p = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      } while (snake.some(s => s.x === p.x && s.y === p.y));
      food = p;
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        die(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('scoreDisplay').textContent = score;
        tg?.HapticFeedback?.impactOccurred('medium');
        placeFood();
        clearInterval(loop);
        loop = setInterval(tick, speed());
      } else {
        snake.pop();
      }

      draw();
    }

    function die() {
      state = 'dead';
      clearInterval(loop);
      tg?.HapticFeedback?.notificationOccurred('error');

      if (score > highScore) {
        highScore = score;
        document.getElementById('highScoreDisplay').textContent = `Best: ${highScore}`;
        tg?.CloudStorage?.setItem('snake_hs', String(highScore), () => {});
      }

      if (tg) {
        tg.MainButton.setText('▶  Play Again');
        tg.MainButton.show();
      }
      draw();
    }

    // ── Drawing ────────────────────────────────────────────────

    function rr(x, y, w, h, r) {
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.rect(x, y, w, h);
      }
    }

    function draw() {
      ctx.fillStyle = theme.secondary;
      ctx.fillRect(0, 0, SIZE, SIZE);

      // Grid lines
      ctx.strokeStyle = theme.hint + '1a';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL); ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ff453a';
      ctx.shadowColor = '#ff453a';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake body
      snake.forEach((seg, i) => {
        ctx.globalAlpha = Math.max(0.35, 1 - (i / snake.length) * 0.65);
        ctx.fillStyle = i === 0 ? theme.button : theme.link;
        ctx.beginPath();
        rr(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? 6 : 3);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Eyes on head
      const h = snake[0];
      const cx = h.x * CELL, cy = h.y * CELL;
      const er = Math.max(2, CELL / 9);
      const eo = CELL * 0.27;
      ctx.fillStyle = theme.secondary;
      let e1, e2;
      if (Math.abs(dir.x) > 0) {
        e1 = [cx + CELL / 2 + dir.x * eo, cy + eo];
        e2 = [cx + CELL / 2 + dir.x * eo, cy + CELL - eo];
      } else {
        e1 = [cx + eo,        cy + CELL / 2 + dir.y * eo];
        e2 = [cx + CELL - eo, cy + CELL / 2 + dir.y * eo];
      }
      ctx.beginPath(); ctx.arc(e1[0], e1[1], er, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e2[0], e2[1], er, 0, Math.PI * 2); ctx.fill();

      if (state === 'start') drawStart();
      if (state === 'dead')  drawDead();
    }

    function overlay() {
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(0, 0, SIZE, SIZE);
    }

    function centeredText(text, y, size, color, bold = false) {
      ctx.fillStyle = color;
      ctx.font = `${bold ? 'bold ' : ''}${size}px system-ui`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, SIZE / 2, y);
    }

    function drawStart() {
      overlay();
      const mid = SIZE / 2;
      centeredText('🐍 Snake', mid - CELL * 2.8, CELL * 1.7, theme.text, true);
      centeredText(`Hi, ${playerName}!`, mid - CELL * 0.8, CELL * 0.95, theme.hint);
      centeredText('Swipe or use arrow keys', mid + CELL * 0.6, CELL * 0.8, theme.hint);
      centeredText('Tap anywhere to start', mid + CELL * 1.9, CELL * 0.8, theme.hint);
      if (highScore > 0) {
        centeredText(`Best: ${highScore}`, mid + CELL * 3.2, CELL * 0.85, theme.button, true);
      }
    }

    function drawDead() {
      overlay();
      const mid = SIZE / 2;
      centeredText('Game Over', mid - CELL * 2.5, CELL * 1.6, '#ff453a', true);
      centeredText(`Score: ${score}`, mid - CELL * 0.5, CELL * 1.1, theme.text, true);
      centeredText(`Best: ${highScore}`, mid + CELL * 1.2, CELL * 0.9, theme.button, true);
    }

    // ── Input ──────────────────────────────────────────────────

    function handleDir(d) {
      if (state !== 'playing') { startGame(); return; }
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:    { x: 0, y: -1 },
        ArrowDown:  { x: 0, y:  1 },
        ArrowLeft:  { x: -1, y: 0 },
        ArrowRight: { x:  1, y: 0 },
      };
      if (map[e.key]) { e.preventDefault(); handleDir(map[e.key]); }
      if (e.key === ' ') { e.preventDefault(); if (state !== 'playing') startGame(); }
    });

    let touch0 = null;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (!touch0) return;
      const dx = e.changedTouches[0].clientX - touch0.x;
      const dy = e.changedTouches[0].clientY - touch0.y;
      touch0 = null;

      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
        if (state !== 'playing') startGame();
        return;
      }
      const d = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 })
        : (dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
      handleDir(d);
    }, { passive: false });

    if (tg) tg.onEvent('mainButtonClicked', startGame);

    // ── Boot-──────────────────────────────────────────────────

    function boot() {
      resize();
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      food = { x: 15, y: 10 };
      draw();
    }

    window.addEventListener('resize', () => { resize(); draw(); });

    if (tg?.CloudStorage) {
      tg.CloudStorage.getItem('snake_hs', (err, val) => {
        if (!err && val) {
          highScore = parseInt(val) || 0;
          document.getElementById('highScoreDisplay').textContent = `Best: ${highScore}`;
        }
        boot();
      });
    } else {
      boot();
    }
  </script>
</body>
</html>
